# MedUnderwrite AI — Docker Compose
# Persona B (Day 2 PM) implements this.
# Three containers: Angular frontend · FastAPI backend · ChromaDB

# TODO (Persona B): fill in all service definitions per developer guide Section 4.6

version: "3.9"

services:
  frontend:
    # TODO: build: ./frontend, port 4200:80, depends_on backend
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - medunderwrite-net

  backend:
    # TODO: build: ./backend, port 8000:8000, env_file .env, volume ./data:/app/data
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      - chromadb
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    networks:
      - medunderwrite-net

  chromadb:
    # TODO: image chromadb/chroma:latest, port 8001:8000, volume ./data/chroma
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    networks:
      - medunderwrite-net

networks:
  medunderwrite-net:
    driver: bridge
