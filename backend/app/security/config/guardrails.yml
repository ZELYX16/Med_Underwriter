version: "1.0"

enabled: true

prompt_validation:
  max_length: 30000
  reject_empty: true

  prompt_injection:
    enabled: true
    action: block

  secret_detection:
    enabled: true
    action: block

  pii_detection:
    enabled: true
    action: sanitize

medical_underwriting:
  prevent_forced_decisions: true
  prevent_guaranteed_approval: true
  prevent_guaranteed_coverage: true

  protected_attributes:
    - race
    - ethnicity
    - religion
    - caste
    - gender
    - sexual_orientation
    - disability

  fairness:
    enabled: true
    action: review

output_validation:
  enabled: true
  reject_unsupported_guarantees: true

risk_levels:
  low:
    action: allow

  medium:
    action: allow_with_sanitization

  high:
    action: block

audit:
  enabled: true
  record_blocked_requests: true
  record_sanitization: true
  record_validation_results: true