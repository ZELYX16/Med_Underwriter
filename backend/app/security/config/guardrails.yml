version: "1.0"

input_validation:
  enabled: true
  max_text_length: 20000
  max_list_items: 100
  reject_empty_submission: true

prompt_injection:
  enabled: true
  action: "block"

  patterns:
    - "ignore all previous instructions"
    - "ignore previous instructions"
    - "disregard all previous instructions"
    - "disregard previous instructions"
    - "system prompt"
    - "developer message"
    - "jailbreak"
    - "bypass safety"
    - "override instructions"

document_validation:
  enabled: true
  allowed_extensions:
    - ".pdf"
    - ".txt"
    - ".json"
    - ".csv"

  max_file_size_mb: 25

retrieval:
  enabled: true
  minimum_results: 1
  maximum_results: 10

  require_metadata:
    - "source"
    - "file_name"

medical_safety:
  enabled: true
  require_evidence_for_medical_claims: true
  require_evidence_for_risk_decisions: true
  require_evidence_for_pricing_decisions: true

regulatory_safety:
  enabled: true
  require_source_for_regulatory_claims: true
  preferred_jurisdiction: "India"
  regulatory_authority: "IRDAI"

human_review:
  enabled: true

  escalation_conditions:
    - "low_confidence"
    - "insufficient_evidence"
    - "regulatory_uncertainty"
    - "fairness_concern"
    - "medical_uncertainty"
    - "reflection_failure"
    - "high_complexity"

audit:
  enabled: true
  record:
    - "case_id"
    - "workflow_node"
    - "retrieval_sources"
    - "decision"
    - "confidence"
    - "human_review"
    - "timestamp"